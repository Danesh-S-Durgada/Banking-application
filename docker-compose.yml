services:
  postgres:
    image: postgres:16
    container_name: banking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bankingdb
      POSTGRES_USER: bankuser
      POSTGRES_PASSWORD: bankpass

    ports:
      - "5432:5432"

    volumes:
      - banking_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankuser -d bankingdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  banking_postgres_data:
